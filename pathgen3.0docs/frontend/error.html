<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Something went wrong · PathGen</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<style>
:root{color-scheme:only light;--primary-50:#eafcfd;--primary-100:#d1f6fa;--primary-200:#a3e9f2;--primary-300:#6ed8e9;--primary-400:#38c9de;--primary-500:#0cc0df;--primary-600:#0a9db8;--primary-700:#087b90;--primary-800:#0a5f6f;--primary-900:#0b4a56;--gray-50:#f8fafb;--gray-100:#eff2f4;--gray-200:#dfe4e8;--gray-300:#c7cfd6;--gray-400:#9aa5b1;--gray-500:#74808d;--gray-600:#57626d;--gray-700:#3f4750;--gray-800:#262b31;--gray-900:#15181b;--success:#1fa860;--success-bg:#e5f7ee;--warning:#e6a319;--warning-bg:#fdf3df;--danger:#e0403f;--danger-bg:#fbe7e6;--color-bg:#ffffff;--color-bg-subtle:var(--gray-50);--color-surface:#ffffff;--color-border:var(--gray-200);--color-border-strong:var(--gray-300);--color-focus-ring:var(--primary-700);--color-text:var(--gray-900);--color-text-secondary:var(--gray-600);--color-text-muted:var(--gray-500);--color-primary:var(--primary-600);--color-primary-hover:var(--primary-700);--color-primary-subtle:var(--primary-50);--color-on-primary:#ffffff;--color-accent:var(--primary-500);--font-sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--text-xs:.75rem;--text-sm:.875rem;--text-base:1rem;--text-lg:1.125rem;--text-xl:1.25rem;--text-2xl:1.5rem;--text-3xl:2rem;--leading-tight:1.2;--leading-normal:1.5;--radius-sm:4px;--radius-md:8px;--radius-lg:12px;--shadow-sm:0 1px 2px rgba(21,24,27,.06);--shadow-md:0 4px 10px rgba(21,24,27,.08);--surface-translucent-bg:rgba(255,255,255,.7);--surface-translucent-blur:20px}
*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%}
body{background:var(--color-bg);color:var(--color-text);font-family:var(--font-sans);font-size:var(--text-base);line-height:var(--leading-normal);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100dvh}

.focus-bar{padding:14px 20px;display:flex;align-items:center;flex-shrink:0}
.back-link{display:inline-flex;align-items:center;gap:6px;padding:7px 14px 7px 10px;border-radius:var(--radius-md);background:var(--surface-translucent-bg);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--color-border);box-shadow:var(--shadow-sm);color:var(--color-text);text-decoration:none;font-size:var(--text-sm);font-weight:500;transition:transform 120ms cubic-bezier(.22,1,.36,1),background 200ms ease,color 200ms ease,border-color 200ms ease}
.back-link:hover{color:var(--color-primary-hover);border-color:var(--color-border-strong)}
.back-link:active{transform:scale(.96)}
.back-link svg{width:16px;height:16px}

.error-main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 20px 64px}
.error-inner{width:100%;max-width:440px;text-align:center}
.error-icon{width:64px;height:64px;margin:0 auto 24px;border-radius:50%;background:var(--color-primary-subtle);color:var(--color-primary);display:flex;align-items:center;justify-content:center}
.error-icon svg{width:28px;height:28px;stroke-width:1.75}
body[data-error="500"] .error-icon{background:var(--warning-bg);color:#a86d00}
.error-code{font-family:var(--font-mono);font-size:3.5rem;font-weight:300;line-height:1;letter-spacing:-.04em;color:var(--color-text-muted);margin:0 0 4px;font-variant-numeric:tabular-nums}
body[data-error="500"] .error-code{color:#b8830c}
.error-title{font-size:var(--text-2xl);font-weight:700;letter-spacing:-.02em;line-height:var(--leading-tight);margin:0 0 10px;color:var(--color-text)}
.error-desc{font-size:var(--text-base);line-height:1.55;color:var(--color-text-secondary);margin:0 0 28px;text-wrap:pretty}
.error-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:var(--radius-md);border:1px solid transparent;font:inherit;font-size:var(--text-sm);font-weight:600;cursor:pointer;text-decoration:none;transition:background 150ms ease,border-color 150ms ease,color 150ms ease,transform 100ms cubic-bezier(.22,1,.36,1)}
.btn:active{transform:scale(.97)}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--color-primary);color:var(--color-on-primary);box-shadow:var(--shadow-sm)}
.btn-primary:hover{background:var(--color-primary-hover)}
.btn-ghost{background:transparent;color:var(--color-text);border-color:var(--color-border)}
.btn-ghost:hover{background:var(--color-bg-subtle);border-color:var(--color-border-strong)}
.error-ref{display:none;margin-top:28px;padding-top:16px;border-top:1px solid var(--color-border);font-size:var(--text-xs);color:var(--color-text-muted);line-height:1.55}
body[data-error="500"] .error-ref,body[data-error="409"] .error-ref{display:block}
.error-ref code{font-family:var(--font-mono);font-size:var(--text-xs);padding:2px 6px;border-radius:var(--radius-sm);background:var(--color-bg-subtle);border:1px solid var(--color-border);color:var(--color-text-secondary)}
.error-switch{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:70;display:flex;gap:2px;padding:3px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);box-shadow:var(--shadow-md);font-family:var(--font-mono)}
.error-switch button{border:none;background:transparent;cursor:pointer;padding:5px 9px;border-radius:calc(var(--radius-md) - 2px);font:inherit;font-size:var(--text-xs);font-weight:600;color:var(--color-text-secondary);letter-spacing:.02em;transition:background 120ms ease,color 120ms ease}
.error-switch button[aria-pressed="true"]{background:var(--color-primary-subtle);color:var(--color-primary)}

@media(min-width:640px){.error-code{font-size:4rem}}
@media(min-width:1024px){.focus-bar{padding:20px 32px}.error-code{font-size:4.5rem}.error-title{font-size:var(--text-3xl)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms !important}.btn:active,.back-link:active{transform:none !important;opacity:.8}}
@media(prefers-reduced-transparency:reduce){.back-link{background:var(--color-surface);backdrop-filter:none;-webkit-backdrop-filter:none}}
@media(prefers-contrast:more){:root{--color-border:var(--gray-400)}.back-link{background:var(--color-surface);backdrop-filter:none;-webkit-backdrop-filter:none}.error-icon{border:1px solid var(--color-border-strong)}}
</style>
</head>

<body data-error="404">

<header class="focus-bar">
  <a href="javascript:history.back()" class="back-link" id="backLink">
    <i data-lucide="arrow-left" aria-hidden="true"></i>
    <span>Go back</span>
  </a>
</header>

<main class="error-main">
  <div class="error-inner">
    <div class="error-icon" aria-hidden="true"><i data-lucide="search" id="errorIcon"></i></div>
    <p class="error-code" id="errorCode" aria-hidden="true">404</p>
    <h1 class="error-title" id="errorTitle">Page not found</h1>
    <p class="error-desc" id="errorDesc">We couldn't find what you were looking for. It may have been moved or deleted.</p>
    <div class="error-actions">
      <!-- Primary → login.html (safe default when unauth) -->
      <a href="login.html" class="btn btn-primary" id="errorPrimary">
        <i data-lucide="home" aria-hidden="true"></i>
        <span>Go home</span>
      </a>
      <a href="javascript:history.back()" class="btn btn-ghost" id="errorSecondary">
        <i data-lucide="arrow-left" aria-hidden="true"></i>
        <span>Back</span>
      </a>
    </div>
    <p class="error-ref" id="errorRef">If this keeps happening, quote reference <code id="errorRefCode">—</code> when contacting support.</p>
  </div>
</main>

<div class="error-switch" role="group" aria-label="Preview error states">
  <button type="button" data-set-error="400" aria-pressed="false">400</button>
  <button type="button" data-set-error="403" aria-pressed="false">403</button>
  <button type="button" data-set-error="404" aria-pressed="true">404</button>
  <button type="button" data-set-error="409" aria-pressed="false">409</button>
  <button type="button" data-set-error="500" aria-pressed="false">500</button>
</div>

<script>
const VARIANTS={
  400:{icon:'alert-circle',title:'Bad request',desc:'Something in that request didn\'t look right. Go back and try again from the previous screen.',primary:{label:'Go back',icon:'arrow-left',href:'javascript:history.back()'},secondary:{label:'Home',icon:'home',href:'login.html'},ref:false},
  403:{icon:'lock',title:'Access denied',desc:'You don\'t have permission to view this page. If you think this is a mistake, contact your administrator.',primary:{label:'Go back',icon:'arrow-left',href:'javascript:history.back()'},secondary:{label:'Home',icon:'home',href:'login.html'},ref:false},
  404:{icon:'search',title:'Page not found',desc:'We couldn\'t find what you were looking for. It may have been moved or deleted.',primary:{label:'Go home',icon:'home',href:'login.html'},secondary:{label:'Back',icon:'arrow-left',href:'javascript:history.back()'},ref:false},
  409:{icon:'refresh-cw',title:'Something changed',desc:'The data you were working with was updated elsewhere. Reload to see the latest version.',primary:{label:'Reload page',icon:'refresh-cw',href:'javascript:location.reload()'},secondary:{label:'Go back',icon:'arrow-left',href:'javascript:history.back()'},ref:true},
  500:{icon:'alert-triangle',title:'Something went wrong',desc:'A server error stopped this page from loading. Your work is safe — try again in a moment.',primary:{label:'Try again',icon:'refresh-cw',href:'javascript:location.reload()'},secondary:{label:'Go home',icon:'home',href:'login.html'},ref:true},
};
function renderError(code){
  const v=VARIANTS[code];if(!v)return;
  document.body.dataset.error=code;
  document.getElementById('errorIcon').setAttribute('data-lucide',v.icon);
  document.getElementById('errorCode').textContent=code;
  document.getElementById('errorTitle').textContent=v.title;
  document.getElementById('errorDesc').textContent=v.desc;
  const p=document.getElementById('errorPrimary'),s=document.getElementById('errorSecondary');
  p.href=v.primary.href;
  p.innerHTML=`<i data-lucide="${v.primary.icon}" aria-hidden="true"></i><span>${v.primary.label}</span>`;
  s.href=v.secondary.href;
  s.innerHTML=`<i data-lucide="${v.secondary.icon}" aria-hidden="true"></i><span>${v.secondary.label}</span>`;
  const ref=document.getElementById('errorRef'),refCode=document.getElementById('errorRefCode');
  if(v.ref){ref.style.display='block';refCode.textContent=`PG-${code}-`+Math.random().toString(36).slice(2,8).toUpperCase();}
  else ref.style.display='none';
  if(window.lucide)lucide.createIcons();
}
renderError(document.body.dataset.error||'404');
document.querySelectorAll('.error-switch button').forEach((btn)=>{
  btn.addEventListener('click',()=>{
    const code=Number(btn.dataset.setError);
    renderError(code);
    document.querySelectorAll('.error-switch button').forEach((b)=>b.setAttribute('aria-pressed',Number(b.dataset.setError)===code?'true':'false'));
  });
});
document.getElementById('backLink')?.addEventListener('click',(e)=>{
  if(history.length>1){e.preventDefault();history.back();}
});
document.addEventListener('keydown',(e)=>{if(e.key==='Escape')document.getElementById('backLink')?.click();});
lucide.createIcons();
</script>
</body>
</html>
