<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Assessment · PathGen</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<style>
/* === REPLACE WITH <link rel="stylesheet" href="{% static 'css/theme.css' %}"> === */
:root {
  color-scheme: only light;
  --primary-50:  #eafcfd; --primary-100: #d1f6fa; --primary-200: #a3e9f2;
  --primary-300: #6ed8e9; --primary-400: #38c9de; --primary-500: #0cc0df;
  --primary-600: #0a9db8; --primary-700: #087b90; --primary-800: #0a5f6f; --primary-900: #0b4a56;
  --gray-50:  #f8fafb; --gray-100: #eff2f4; --gray-200: #dfe4e8; --gray-300: #c7cfd6;
  --gray-400: #9aa5b1; --gray-500: #74808d; --gray-600: #57626d; --gray-700: #3f4750;
  --gray-800: #262b31; --gray-900: #15181b;
  --success: #1fa860; --success-bg: #e5f7ee;
  --danger:  #e0403f; --danger-bg:  #fbe7e6;
  --color-bg:            #ffffff;
  --color-bg-subtle:     var(--gray-50);
  --color-surface:       #ffffff;
  --color-border:        var(--gray-200);
  --color-border-strong: var(--gray-300);
  --color-focus-ring:    var(--primary-700);
  --color-text:            var(--gray-900);
  --color-text-secondary:  var(--gray-600);
  --color-text-muted:      var(--gray-500);
  --color-primary:        var(--primary-600);
  --color-primary-hover:  var(--primary-700);
  --color-primary-subtle: var(--primary-50);
  --color-on-primary:     #ffffff;
  --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-base: 1rem;
  --text-lg: 1.125rem; --text-xl: 1.25rem; --text-2xl: 1.5rem; --text-3xl: 2rem;
  --leading-tight: 1.2; --leading-normal: 1.5;
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 2px rgba(21, 24, 27, 0.06);
  --shadow-md: 0 4px 10px rgba(21, 24, 27, 0.08);
  --surface-translucent-bg:   rgba(255, 255, 255, 0.7);
  --surface-translucent-blur: 20px;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100%; }
body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: var(--leading-normal);
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---- Focus bar — a single back link ---- */
.focus-bar {
  position: sticky; top: 0; z-index: 30;
  padding: 14px 20px;
  display: flex; align-items: center;
  background: linear-gradient(to bottom, var(--color-bg) 60%, rgba(255,255,255,0));
  pointer-events: none;
}
.back-link {
  pointer-events: auto;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px 7px 10px;
  border-radius: var(--radius-md);
  background: var(--surface-translucent-bg);
  backdrop-filter: blur(var(--surface-translucent-blur)) saturate(180%);
  -webkit-backdrop-filter: blur(var(--surface-translucent-blur)) saturate(180%);
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow-sm);
  color: var(--color-text);
  text-decoration: none;
  font-size: var(--text-sm);
  font-weight: 500;
  transition: transform 120ms cubic-bezier(0.22, 1, 0.36, 1),
              background 200ms ease,
              color 200ms ease,
              border-color 200ms ease;
  -webkit-tap-highlight-color: transparent;
}
.back-link:hover {
  color: var(--color-primary-hover);
  border-color: var(--color-border-strong);
}
.back-link:active { transform: scale(0.96); }
.back-link svg { width: 16px; height: 16px; }

/* ---- Content ---- */
.content {
  max-width: 640px;
  margin: 0 auto;
  padding: 20px 20px 96px;
}
.progress-row {
  display: flex; align-items: center; justify-content: space-between;
  font-size: var(--text-xs);
  color: var(--color-text-muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-weight: 600;
  margin-bottom: 16px;
}
.progress-bar {
  height: 4px; border-radius: 999px;
  background: var(--color-border);
  overflow: hidden;
  margin-bottom: 32px;
}
.progress-bar > span {
  display: block; height: 100%;
  background: var(--color-primary);
  border-radius: 999px;
  transition: width 400ms cubic-bezier(0.22, 1, 0.36, 1);
}

.question {
  font-size: var(--text-xl);
  line-height: 1.4;
  letter-spacing: -0.01em;
  font-weight: 600;
  margin: 0 0 24px;
}

.choices {
  display: flex; flex-direction: column; gap: 8px;
  list-style: none; padding: 0; margin: 0 0 24px;
}
.choice {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  cursor: pointer;
  transition: background 120ms ease, border-color 120ms ease, transform 100ms cubic-bezier(0.22, 1, 0.36, 1);
  -webkit-tap-highlight-color: transparent;
}
.choice:hover { background: var(--color-bg-subtle); border-color: var(--color-border-strong); }
.choice:active { transform: scale(0.985); }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice .letter {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--color-bg-subtle);
  border: 1px solid var(--color-border);
  color: var(--color-text-secondary);
  display: flex; align-items: center; justify-content: center;
  font-size: var(--text-xs);
  font-weight: 700;
  flex-shrink: 0;
  transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
}
.choice .text {
  font-size: var(--text-base);
  color: var(--color-text);
}
.choice input:checked ~ .letter {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: var(--color-on-primary);
}
.choice:has(input:checked) {
  border-color: var(--color-primary);
  background: var(--color-primary-subtle);
}
.choice input:focus-visible ~ .letter {
  outline: 2px solid var(--color-focus-ring);
  outline-offset: 2px;
}

.actions {
  display: flex; justify-content: flex-end; gap: 8px;
}
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 18px;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  font: inherit;
  font-size: var(--text-sm);
  font-weight: 600;
  cursor: pointer;
  transition: background 150ms ease, transform 100ms cubic-bezier(0.22, 1, 0.36, 1);
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--color-primary);
  color: var(--color-on-primary);
  box-shadow: var(--shadow-sm);
}
.btn-primary:hover { background: var(--color-primary-hover); }
.btn svg { width: 16px; height: 16px; }

@media (min-width: 640px) {}
@media (min-width: 768px) {}
@media (min-width: 1024px) {
  .focus-bar { padding: 20px 32px; }
  .content   { padding: 24px 32px 120px; }
  .question  { font-size: var(--text-2xl); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}
@media (prefers-reduced-transparency: reduce) {
  .back-link { background: var(--color-surface); backdrop-filter: none; -webkit-backdrop-filter: none; }
}
@media (prefers-contrast: more) {
  :root { --color-border: var(--gray-400); }
  .back-link { background: var(--color-surface); backdrop-filter: none; -webkit-backdrop-filter: none; }
}
</style>
</head>
<body>

<header class="focus-bar">
  <a href="#" class="back-link" id="backLink">
    <i data-lucide="arrow-left" aria-hidden="true"></i>
    <span>Exit</span>
  </a>
</header>

<main class="content">
  <div class="progress-row">
    <span>Question 3 of 6</span>
    <span>Regular exercise</span>
  </div>
  <div class="progress-bar" aria-hidden="true"><span style="width: 50%"></span></div>

  <p class="question">Which list is ordered from least to greatest?</p>

  <ul class="choices" role="radiogroup" aria-label="Answer choices">
    <li>
      <label class="choice">
        <input type="radio" name="q3" value="A">
        <span class="letter" aria-hidden="true">A</span>
        <span class="text">−6, −2, 0, 4</span>
      </label>
    </li>
    <li>
      <label class="choice">
        <input type="radio" name="q3" value="B">
        <span class="letter" aria-hidden="true">B</span>
        <span class="text">4, 0, −2, −6</span>
      </label>
    </li>
    <li>
      <label class="choice">
        <input type="radio" name="q3" value="C">
        <span class="letter" aria-hidden="true">C</span>
        <span class="text">−2, −6, 0, 4</span>
      </label>
    </li>
    <li>
      <label class="choice">
        <input type="radio" name="q3" value="D">
        <span class="letter" aria-hidden="true">D</span>
        <span class="text">−6, 0, −2, 4</span>
      </label>
    </li>
  </ul>

  <div class="actions">
    <button type="button" class="btn btn-primary">
      Submit <i data-lucide="arrow-right" aria-hidden="true"></i>
    </button>
  </div>
</main>

<script>
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') document.getElementById('backLink').click();
  });
  lucide.createIcons();
</script>
</body>
</html>
