{% load static %}
<dialog aria-labelledby="update-user-{{ managed_user.pk }}-title" id="update-user-{{ managed_user.pk }}" class="border" data-ui="modal-dialog">
  <div data-ui="modal-content"><div data-ui="modal-header"><div><p class="text-sm" data-ui="eyebrow"><i data-lucide="circle-check" aria-hidden="true"></i>Users</p><h2 id="update-user-{{ managed_user.pk }}-title">Update {{ managed_user.username }}</h2></div><button class="text-xl [background:var(--color-bg-subtle)] [color:var(--color-text-secondary)]" data-ui="icon-button" type="button" data-dialog-close aria-label="Close update account dialog"><i data-lucide="x" aria-hidden="true"></i></button></div>
    <form data-ui="form-stack" method="post" action="{% url 'portal:update_user' managed_user.pk %}">{% csrf_token %}<div><span class="block text-sm">Role</span><p class="[color:var(--color-text-secondary)]">{{ managed_user.get_role_display }} · Role cannot be changed here.</p></div><div data-ui="form-field"><label class="block text-sm" data-ui="form-label" for="first-name-{{ managed_user.pk }}">First name</label><input class="border" data-ui="form-input" id="first-name-{{ managed_user.pk }}" name="first_name" value="{{ managed_user.first_name }}" required maxlength="150"></div><div data-ui="form-field"><label class="block text-sm" data-ui="form-label" for="last-name-{{ managed_user.pk }}">Last name</label><input class="border" data-ui="form-input" id="last-name-{{ managed_user.pk }}" name="last_name" value="{{ managed_user.last_name }}" required maxlength="150"></div><div data-ui="form-field"><label class="block text-sm" data-ui="form-label" for="email-{{ managed_user.pk }}">Email</label><input class="border" data-ui="form-input" id="email-{{ managed_user.pk }}" name="email" type="email" value="{{ managed_user.email|default:'' }}"></div><div data-ui="account-actions"><button class="[background:var(--color-bg-subtle)]" data-ui="secondary-button" type="button" data-dialog-close>Cancel</button><button data-ui="primary-button" type="submit">Save changes</button></div></form>
  </div>
</dialog>
