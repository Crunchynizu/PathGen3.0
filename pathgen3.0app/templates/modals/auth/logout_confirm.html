{% extends "_base.html" %}
{% block title %}Sign out · PathGen{% endblock %}
{% block content %}
<section class="border"><h1>Sign out</h1><p class="[color:var(--color-text-secondary)]">Review the confirmation or return to your account.</p><div><button type="button" data-dialog-open="logout-dialog">Review sign out</button><a class="border" href="{% url 'account:my_account' %}">Back to account</a></div></section>
<dialog id="logout-dialog" aria-labelledby="logout-dialog-title" aria-describedby="logout-dialog-description" class="border" data-ui="modal-dialog" data-auto-open>
  <div><div><div><p class="text-sm"><i data-lucide="log-out" aria-hidden="true"></i>Account</p><h2 id="logout-dialog-title">Sign out?</h2></div><button class="[background:var(--color-bg-subtle)] [color:var(--color-text-secondary)]" type="button" data-dialog-close aria-label="Close sign-out dialog"><i data-lucide="x" aria-hidden="true"></i></button></div>
    <p id="logout-dialog-description" class="[color:var(--color-text-secondary)]">You will need to enter your credentials to return.</p>
    <form method="post" action="{% url 'account:logout' %}">{% csrf_token %}<button class="border" type="button" data-dialog-close>Cancel</button><button type="submit">Sign out</button></form>
  </div>
</dialog>
{% endblock %}
