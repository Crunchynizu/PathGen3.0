{% load static %}
<dialog aria-describedby="generic-confirm-description" aria-labelledby="generic-confirm-title" id="{% block dialog_id %}confirm-dialog{% endblock %}" class="border" data-ui="modal-dialog">
  <div data-ui="modal-content">
    <div data-ui="modal-header">
      <div><p class="text-sm" data-ui="eyebrow"><i data-lucide="circle-check" aria-hidden="true"></i>Confirmation</p><h2 id="generic-confirm-title">{% block dialog_title %}Confirm action{% endblock %}</h2></div>
      <button class="text-xl [background:var(--color-bg-subtle)] [color:var(--color-text-secondary)]" data-ui="icon-button" type="button" data-dialog-close aria-label="Close dialog"><i data-lucide="x" aria-hidden="true"></i></button>
    </div>
    <p id="generic-confirm-description" class="[color:var(--color-text-secondary)]" data-ui="page-copy">{% block dialog_message %}Review this action before continuing.{% endblock %}</p>
    {% block dialog_body %}{% endblock %}
    {% block dialog_actions %}<div><button class="border" type="button" data-dialog-close>Cancel</button><button type="button" data-dialog-confirm>Confirm</button></div>{% endblock %}
  </div>
</dialog>
