{% load static %}
<dialog data-escape-close="false" aria-describedby="remove-membership-{{ membership.pk }}-description" aria-labelledby="remove-membership-{{ membership.pk }}-title" id="remove-membership-{{ membership.pk }}" class="border" data-ui="modal-dialog"><div data-ui="modal-content"><div data-ui="modal-header"><div><p class="text-sm" data-ui="eyebrow"><i data-lucide="alert-triangle" aria-hidden="true"></i>Class membership</p><h2 id="remove-membership-{{ membership.pk }}-title">Remove {{ membership.student.get_full_name|default:membership.student.username }}?</h2></div><button class="text-xl [background:var(--color-bg-subtle)] [color:var(--color-text-secondary)]" data-ui="icon-button" type="button" data-dialog-close aria-label="Close remove student dialog"><i data-lucide="x" aria-hidden="true"></i></button></div><p id="remove-membership-{{ membership.pk }}-description" class="[color:var(--color-text-secondary)]" data-ui="page-copy">The membership will be closed and retained as history. Learning access is unaffected.</p><form data-ui="account-actions" method="post" action="{% url 'portal:remove_student' membership.pk %}">{% csrf_token %}<button class="[background:var(--color-bg-subtle)]" data-ui="secondary-button" type="button" data-dialog-close>Cancel</button><button data-ui="danger-button" type="submit">Remove {{ membership.student.get_full_name|default:membership.student.username }}</button></form></div></dialog>
