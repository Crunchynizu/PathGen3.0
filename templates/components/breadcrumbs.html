{% if breadcrumbs %}
<nav class="[&_a]:inline-flex [&_a]:min-h-11 [&_a]:items-center [&_a]:font-semibold [&_a]:underline-offset-4 [&_a]:[color:var(--color-text-link)] [&_a:hover]:underline [&_ol]:flex [&_ol]:flex-wrap [&_ol]:items-center [&_ol]:gap-2 [&_ol]:text-sm [&_ol]:[color:var(--color-text-secondary)] [&_li:not(:last-child)::after]:ml-2 [&_li:not(:last-child)::after]:[content:'>'] [&_li:not(:last-child)::after]:[color:var(--color-text-muted)]" data-ui="breadcrumbs" aria-label="Breadcrumb">
  <ol><li><a href="/">Home</a></li>{% for crumb in breadcrumbs %}<li>{% if crumb.url and not forloop.last %}<a href="{{ crumb.url }}">{{ crumb.label }}</a>{% else %}<span aria-current="page">{{ crumb.label }}</span>{% endif %}</li>{% endfor %}</ol>
</nav>
{% endif %}
