{% if back_url %}<div class="pointer-events-none sticky top-0 z-30 flex items-center px-5 py-[14px] [background:linear-gradient(to_bottom,var(--color-bg)_60%,transparent)] lg:px-8 lg:py-5" data-ui="focus-bar"><a class="pointer-events-auto inline-flex min-h-11 items-center gap-[6px] rounded-lg border py-[7px] pl-[10px] pr-[14px] text-sm font-medium no-underline [background:var(--surface-translucent-bg)] [border-color:var(--color-border)] [box-shadow:var(--shadow-sm)] [color:var(--color-text)] [backdrop-filter:blur(var(--surface-translucent-blur))_saturate(180%)] hover:[border-color:var(--color-border-strong)] hover:[color:var(--color-primary-hover)] active:scale-[0.96] motion-reduce:active:transform-none [@media(prefers-reduced-transparency:reduce)]:[background:var(--color-surface)] [@media(prefers-reduced-transparency:reduce)]:[backdrop-filter:none]" data-ui="back-link" href="{{ back_url }}"><i data-lucide="arrow-left" class="h-4 w-4" aria-hidden="true"></i><span>{{ back_label|default:"Back" }}</span></a></div>{% endif %}
