{% load static %}
<span class="inline-flex min-h-7 max-w-full items-center gap-2 rounded-full px-3 py-1 text-sm font-semibold [line-height:var(--leading-normal)] [&_svg]:h-4 [&_svg]:w-4 {% if status == 'closed' or status == 'inactive' or status == 'archived' %}[background:var(--color-bg-subtle)] [color:var(--color-text-secondary)]{% else %}[background:var(--color-primary-subtle)] [color:var(--color-primary-hover)]{% endif %}" data-ui="status-badge">{% if status == 'locked' or status == 'closed' or status == 'inactive' or status == 'archived' %}<i data-lucide="lock-keyhole" class="w-5 h-5 inline-block shrink-0 align-middle" aria-hidden="true"></i>{% elif status == 'completed' or status == 'active' or status == 'open' %}<i data-lucide="circle-check" class="w-5 h-5 inline-block shrink-0 align-middle" aria-hidden="true"></i>{% else %}<i data-lucide="info" class="w-5 h-5 inline-block shrink-0 align-middle" aria-hidden="true"></i>{% endif %} {{ label|default:status|title }}</span>
