{% load static %}
{% with avatar_role=role|default:user.role %}
<img class="inline-block shrink-0 rounded-full object-cover {% if size == 'sm' %}h-6 w-6{% elif size == 'lg' %}h-12 w-12{% else %}h-8 w-8{% endif %}" data-ui="avatar" src="{% if avatar_role == 'admin' %}{% static 'avatar/admin_avatar.png' %}{% elif avatar_role == 'teacher' %}{% static 'avatar/teacher_avatar.png' %}{% else %}{% static 'avatar/student_avatar.png' %}{% endif %}" alt="{{ avatar_role|default:'student' }} avatar" width="{% if size == 'sm' %}24{% elif size == 'lg' %}48{% else %}32{% endif %}" height="{% if size == 'sm' %}24{% elif size == 'lg' %}48{% else %}32{% endif %}" loading="lazy" decoding="async">
{% endwith %}
