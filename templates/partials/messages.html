{% load static %}
{% if messages %}<div class="space-y-4" data-ui="message-stack" aria-live="polite">{% for message in messages %}<div class="rounded-xl border px-4 py-3 text-sm [color:var(--color-text)] [&_svg]:[margin-right:0.5rem] {% if 'error' in message.tags %}[background:var(--color-danger-subtle)] [border-color:var(--color-danger)]{% elif 'warning' in message.tags %}[background:var(--color-warning-subtle)] [border-color:var(--color-warning)]{% elif 'info' in message.tags %}[background:var(--color-primary-subtle)] [border-color:var(--color-primary)]{% else %}[background:var(--color-success-subtle)] [border-color:var(--color-success)]{% endif %}" data-ui="message" role="status">{% if 'error' in message.tags or 'warning' in message.tags %}<i data-lucide="alert-triangle" class="w-5 h-5 inline-block shrink-0 align-middle" aria-hidden="true"></i>{% else %}<i data-lucide="circle-check" class="w-5 h-5 inline-block shrink-0 align-middle" aria-hidden="true"></i>{% endif %}{{ message }}</div>{% endfor %}</div>{% endif %}
