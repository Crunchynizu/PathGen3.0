{% if feedback %}<section class="assessment-feedback {% if feedback.is_correct %}feedback-correct{% else %}feedback-incorrect{% endif %}" tabindex="-1" aria-live="polite" data-feedback><p class="eyebrow">Answer saved</p><h2>{{ feedback.heading }}</h2><p>{{ feedback.text }}</p>{% if feedback.explanation %}<p class="feedback-explanation"><strong>Why:</strong> {{ feedback.explanation }}</p>{% endif %}</section>{% endif %}
