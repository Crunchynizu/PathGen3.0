{% if feedback %}<section class="rounded-2xl border p-5 [background:var(--color-surface)] [border-color:var(--color-border)] mb-5 grid gap-3 p-6 {% if feedback.is_correct %}[background:var(--color-success-subtle)] [border-color:var(--color-success)]{% else %}[background:var(--color-warning-subtle)] [border-color:var(--color-warning)]{% endif %}" data-ui="assessment-feedback feedback-correct feedback-incorrect" tabindex="-1" aria-live="polite" data-feedback><p class="mb-2 text-sm font-semibold uppercase tracking-wider [color:var(--color-text-cyan)]" data-ui="eyebrow">Answer saved</p><h2>{{ feedback.heading }}</h2><p>{{ feedback.text }}</p>{% if feedback.explanation %}<p class="border-t pt-3 leading-7 [border-color:var(--color-border)] [color:var(--color-text-secondary)]" data-ui="feedback-explanation"><strong>Why:</strong> {{ feedback.explanation }}</p>{% endif %}</section>{% endif %}
