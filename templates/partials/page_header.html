{% load static %}
<header class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between mb-8 [padding-bottom:1.5rem] [border-bottom:1px_solid_var(--color-border)]" data-ui="page-header"><div><p class="mb-2 text-sm font-semibold uppercase tracking-wider [color:var(--color-text-cyan)]" data-ui="eyebrow">{{ eyebrow }}</p><h1 class="text-3xl font-bold tracking-tight [color:var(--color-text)] max-sm:[font-size:var(--text-2xl)]" data-ui="page-title">{{ page_title }}</h1>{% if page_subtitle %}<p class="mt-2 leading-7 [color:var(--color-text-secondary)] [max-width:65ch]" data-ui="page-copy">{{ page_subtitle }}</p>{% endif %}</div>{% if header_action_label %}<button class="inline-flex min-h-11 items-center justify-center rounded-xl px-5 py-3 font-semibold transition-transform active:scale-[0.98] [background:var(--color-primary)] [color:var(--color-on-primary)] [&:hover]:[background:var(--color-primary-hover)] [&:link]:[color:var(--color-on-primary)] [&:visited]:[color:var(--color-on-primary)] [gap:0.5rem] [border-radius:var(--radius-md)] [transition:transform_150ms_ease-out,_opacity_150ms_ease-out]" data-ui="primary-button" type="button" data-dialog-open="{{ header_action_dialog }}"><i data-lucide="arrow-right" class="w-5 h-5 inline-block shrink-0 align-middle" aria-hidden="true"></i>{{ header_action_label }}</button>{% endif %}</header>
