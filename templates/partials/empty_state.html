{% load static %}
<section class="rounded-2xl border p-5 sm:p-6 [background:var(--color-surface)] [border-color:var(--color-border)] [box-shadow:var(--shadow-sm)] [&_h2]:text-xl [&_h2]:font-bold [&_>_p]:[max-width:65ch] [&_[data-ui~=icon-tile]]:[margin-bottom:1rem] [&_h2]:[margin-bottom:0.5rem]" data-ui="empty-state"><span class="[display:inline-flex] [align-items:center] [justify-content:center] [width:2.5rem] [height:2.5rem] [border-radius:var(--radius-md)] [background:var(--color-primary-subtle)] [flex-shrink:0]" data-ui="icon-tile"><i data-lucide="search" class="w-5 h-5 inline-block shrink-0 align-middle" aria-hidden="true"></i></span><h2>{{ empty_title|default:"Nothing here yet" }}</h2><p>{{ empty_body|default:"Records will appear here when they are available." }}</p>{% if empty_action_url %}<a class="inline-flex min-h-11 items-center font-semibold underline-offset-4 hover:underline [color:var(--color-text-cyan)]" data-ui="text-link" href="{{ empty_action_url }}">{{ empty_action_label|default:"Continue" }}</a>{% else %}<a class="inline-flex min-h-11 items-center font-semibold underline-offset-4 hover:underline [color:var(--color-text-cyan)]" data-ui="text-link" href="{{ request.path }}">Refresh this view</a>{% endif %}</section>
