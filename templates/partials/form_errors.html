{% load static %}
{% if form.errors %}<div class="rounded-xl border px-4 py-3 text-sm [background:var(--color-danger-subtle)] [border-color:var(--color-danger)] [color:var(--color-text)] [&_>_svg]:[margin-right:0.5rem] [&_ul]:[margin-top:0.5rem] [&_a]:[display:inline-flex] [&_a]:[min-height:44px] [&_a]:[align-items:center]" data-ui="error-summary" role="alert" tabindex="-1"><i data-lucide="alert-triangle" class="w-5 h-5 inline-block shrink-0 align-middle" aria-hidden="true"></i><strong>Please correct the highlighted fields.</strong>{{ form.non_field_errors }}<ul>{% for field in form %}{% for error in field.errors %}<li><a href="#{{ field.id_for_label }}">{{ field.label }}: {{ error }}</a></li>{% endfor %}{% endfor %}</ul></div>{% endif %}
