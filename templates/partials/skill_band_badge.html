{% load static %}
<span class="inline-flex min-h-7 items-center gap-2 rounded-full px-3 py-1 text-sm font-semibold [background:var(--color-primary-subtle)] [color:var(--color-primary-hover)] [max-width:100%] [line-height:var(--leading-normal)] [&_svg]:[width:1rem] [&_svg]:[height:1rem] skill-{{ band|slugify }}" data-ui="status-badge">{% if band == 'Strong' %}<i data-lucide="circle-check" class="w-5 h-5 inline-block shrink-0 align-middle" aria-hidden="true"></i>{% elif band == 'Needs Practice' %}<i data-lucide="alert-triangle" class="w-5 h-5 inline-block shrink-0 align-middle" aria-hidden="true"></i>{% else %}<i data-lucide="info" class="w-5 h-5 inline-block shrink-0 align-middle" aria-hidden="true"></i>{% endif %} {{ band|default:"Not enough evidence" }}</span>
