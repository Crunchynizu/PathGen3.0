{% load static %}
<article class="rounded-2xl border p-5 sm:p-6 [background:var(--color-surface)] [border-color:var(--color-border)] [box-shadow:var(--shadow-sm)] [border:1px_solid_var(--color-border)] [border-radius:var(--radius-lg)] [padding:1.5rem] max-sm:[padding:1rem]" data-ui="kpi-card"><div class="[display:flex] [justify-content:space-between] [align-items:start] [gap:1rem]" data-ui="kpi-heading"><p class="text-sm [color:var(--color-text-secondary)] [font-weight:var(--font-weight-medium)]" data-ui="kpi-label">{{ label }}</p><span class="[display:inline-flex] [align-items:center] [justify-content:center] [width:2.5rem] [height:2.5rem] [border-radius:var(--radius-md)] [background:var(--color-primary-subtle)] [flex-shrink:0]" data-ui="icon-tile"><i data-lucide="chart-no-axes-column" class="w-5 h-5 inline-block shrink-0 align-middle" aria-hidden="true"></i></span></div><p class="my-2 text-3xl font-bold tracking-tight [color:var(--color-text)] [font-size:var(--text-3xl)] [font-variant-numeric:tabular-nums]" data-ui="kpi-value">{{ value }}</p>{% if delta %}<p class="kpi-delta">{{ delta }}</p>{% endif %}{% if definition %}<p class="text-sm [color:var(--color-text-secondary)]" data-ui="kpi-definition">{{ definition }}</p>{% endif %}</article>
