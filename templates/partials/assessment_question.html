{% load static %}
{% if question.video %}{% include "partials/video_player.html" with video=question.video pause_seconds=question.video_pause_seconds %}{% endif %}
<fieldset class="rounded-2xl border p-5 [background:var(--color-surface)] [border-color:var(--color-border)] mb-5 p-0 [border:0] [&_legend]:mb-5 [&_legend]:text-xl [&_legend]:font-bold [&_legend]:leading-8 [&_legend]:[color:var(--color-text)]" data-ui="question-card"{% if question.video %} data-video-question hidden{% endif %}>
  <legend>{{ question.prompt }}</legend>
  {% if question.image_asset %}<img class="mb-5 max-h-72 w-full rounded-2xl object-contain [background:var(--color-bg-subtle)]" data-ui="assessment-figure" src="{% static question.image_asset %}" alt="{{ question.image_alt }}">{% endif %}
  <div class="grid gap-3" data-ui="choice-grid">
    {% for choice in choices %}
      <label class="mt-3 flex min-h-11 items-center gap-3 rounded-xl border p-3 [border-color:var(--color-border)] m-0 cursor-pointer transition-transform active:scale-[0.99] [background:var(--color-surface)] [&:has(input:checked)]:[background:var(--color-primary-subtle)] [&:has(input:checked)]:[border-color:var(--color-primary)] [&_input]:h-5 [&_input]:w-5 [&_input]:shrink-0 [&_input]:[accent-color:var(--color-primary)]" data-ui="choice"><input type="radio" name="choice" value="{{ choice.id }}" required> <span><strong>{{ choice.label }}</strong> {{ choice.text }}</span></label>
    {% endfor %}
  </div>
</fieldset>
