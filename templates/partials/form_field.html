{% load static %}
<div class="space-y-2" data-ui="form-field"><label class="block text-sm font-semibold [color:var(--color-text)]" data-ui="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<div class="text-sm [color:var(--color-text-secondary)]" data-ui="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}{% if field.errors %}<div class="rounded-xl border px-4 py-3 text-sm [background:var(--color-danger-subtle)] [border-color:var(--color-danger)] [color:var(--color-text)] [color:var(--color-danger)] [&_svg]:[margin-right:0.5rem] [&_ul]:[display:inline]" data-ui="field-errors"><i data-lucide="alert-triangle" class="w-5 h-5 inline-block shrink-0 align-middle" aria-hidden="true"></i>{{ field.errors }}</div>{% endif %}</div>
