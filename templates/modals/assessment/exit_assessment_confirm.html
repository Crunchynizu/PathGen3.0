{% load static %}
<dialog aria-describedby="exit-assessment-dialog-description" aria-labelledby="exit-assessment-dialog-title" id="exit-assessment-dialog" class="ui-dialog" data-ui="modal-dialog">
  <div class="ui-dialog-head" data-ui="modal-header">
    <div><p class="ui-eyebrow" data-ui="eyebrow"><i data-lucide="pause-circle" aria-hidden="true"></i>Assessment</p><h2 id="exit-assessment-dialog-title">Exit this assessment?</h2></div>
    <button class="ui-icon-btn" data-ui="icon-button" type="button" data-dialog-close aria-label="Close exit confirmation"><i data-lucide="x" aria-hidden="true"></i></button>
  </div>
  <div class="ui-dialog-body" data-ui="modal-content"><p id="exit-assessment-dialog-description" data-ui="page-copy">Your answers so far are saved. You can resume this assessment later.</p></div>
  <div class="ui-dialog-actions" data-ui="account-actions"><button class="ui-btn ui-btn-secondary" data-ui="secondary-button" type="button" data-dialog-close>Cancel</button><a class="ui-btn ui-btn-danger" data-ui="danger-button" href="{{ exit_url }}">Exit assessment</a></div>
</dialog>
