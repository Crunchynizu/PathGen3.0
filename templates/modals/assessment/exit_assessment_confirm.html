order-radius:var(--radius-md)] [transition:transform_150ms_ease-out,_opacity_150ms_ease-out] [border:1px_solid_var(--color-border-strong)] [background:transparent]" data-ui="secondary-button" type="button" data-dialog-close>Cancel</button><a class="inline-flex min-h-11 items-center justify-center rounded-xl px-5 py-3 font-semibold transition-transform active:scale-[0.98] [background:var(--color-danger)] [color:var(--color-on-primary)] [&:link]:[color:var(--color-on-primary)] [&:visited]:[color:var(--color-on-primary)] [gap:0.5rem] [border-radius:var(--radius-md)] [transition:transform_150ms_ease-out,_opacity_150ms_ease-out]" data-ui="danger-button" href="{{ exit_url }}">Exit assessment</a></div></div></dialog>
