<dialog aria-label="Audit Detail" id="audit-detail-{{ event.pk }}" class="modal-dialog"><div class="modal-content"><div class="modal-header"><div><p class="eyebrow">Immutable audit event</p><h2>{{ event.action }}</h2></div><button class="icon-button" type="button" data-dialog-close aria-label="Close audit detail">×</button></div><dl class="detail-list"><div><dt>Actor</dt><dd>{{ event.actor.username|default:"System" }}</dd></div><div><dt>Target</dt><dd>{{ event.target_type }}</dd></div><div><dt>Time</dt><dd>{{ event.created_at }}</dd></div><div><dt>Reason</dt><dd>{{ event.reason|default:"Not required" }}</dd></div></dl></div></dialog>
