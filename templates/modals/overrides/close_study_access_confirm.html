{% load static %}
<dialog data-escape-close="false" aria-describedby="close-study-access-dialog-description" aria-labelledby="close-study-access-dialog-title" id="close-study-access-dialog" class="border" data-ui="modal-dialog"><div data-ui="modal-content"><div data-ui="modal-header"><div><p class="text-sm" data-ui="eyebrow"><i data-lucide="alert-triangle" aria-hidden="true"></i>Study Access</p><h2 id="close-study-access-dialog-title">Close Study Access?</h2></div><button class="text-xl [background:var(--color-bg-subtle)] [color:var(--color-text-secondary)]" data-ui="icon-button" type="button" data-dialog-close aria-label="Close Study Access dialog"><i data-lucide="x" aria-hidden="true"></i></button></div><p id="close-study-access-dialog-description" class="[color:var(--color-text-secondary)]" data-ui="page-copy">Students will be blocked by policy. Teachers and admins remain unaffected.</p><p class="border text-sm [background:var(--color-bg-subtle)]">Current Study Access: {{ setting.study_access_enabled|yesno:"OPEN,CLOSED" }} → Pending: CLOSED</p><form data-ui="form-stack" method="post" action="{% url 'portal:override' %}">{% csrf_token %}<input type="hidden" name="expected_revision" value="{{ revision }}"><input type="hidden" name="setting_name" value="study_access"><input type="hidden" name="enabled" value="false"><div data-ui="form-field"><label class="block text-sm" data-ui="form-label" for="close-study-reason">Reason</label><textarea class="border" data-ui="form-input" id="close-study-reason" name="reason" rows="4" minlength="3" required></textarea></div><div data-ui="account-actions"><button class="[background:var(--color-bg-subtle)]" data-ui="secondary-button" type="button" data-dialog-close>Cancel</button><button data-ui="danger-button" type="submit">Close Study Access</button></div></form></div></dialog>
