<dialog aria-label="Open Study Access Confirm" id="open-study-access-dialog" class="modal-dialog"><div class="modal-content"><div class="modal-header"><div><p class="eyebrow">Study Access</p><h2>Open Study Access?</h2></div><button class="icon-button" type="button" data-dialog-close aria-label="Close open Study Access dialog">×</button></div><p class="page-copy">Active students may enter their learning journey. Class membership is not considered.</p><form class="form-stack" method="post" action="{% url 'portal:override' %}">{% csrf_token %}<input type="hidden" name="expected_revision" value="{{ revision }}"><input type="hidden" name="setting_name" value="study_access"><input type="hidden" name="enabled" value="true"><div class="form-field"><label class="form-label" for="open-study-reason">Reason</label><textarea class="form-input" id="open-study-reason" name="reason" rows="4" required></textarea></div><div class="account-actions"><button class="primary-button" type="submit">Open Study Access</button><button class="secondary-button" type="button" data-dialog-close>Cancel</button></div></form></div></dialog>
