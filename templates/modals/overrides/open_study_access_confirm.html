{% load static %}
<dialog aria-describedby="open-study-access-dialog-description" aria-labelledby="open-study-access-dialog-title" id="open-study-access-dialog" class="border" data-ui="modal-dialog"><div data-ui="modal-content"><div data-ui="modal-header"><div><p class="text-sm" data-ui="eyebrow"><i data-lucide="circle-check" aria-hidden="true"></i>Study Access</p><h2 id="open-study-access-dialog-title">Open Study Access?</h2></div><button class="text-xl [background:var(--color-bg-subtle)] [color:var(--color-text-secondary)]" data-ui="icon-button" type="button" data-dialog-close aria-label="Close open Study Access dialog"><i data-lucide="x" aria-hidden="true"></i></button></div><p id="open-study-access-dialog-description" class="[color:var(--color-text-secondary)]" data-ui="page-copy">Active students may enter their learning journey. Class membership is not considered.</p><p class="border text-sm [background:var(--color-bg-subtle)]">Current Study Access: {{ setting.study_access_enabled|yesno:"OPEN,CLOSED" }} → Pending: OPEN</p><form data-ui="form-stack" method="post" action="{% url 'portal:override' %}">{% csrf_token %}<input type="hidden" name="expected_revision" value="{{ revision }}"><input type="hidden" name="setting_name" value="study_access"><input type="hidden" name="enabled" value="true"><div data-ui="form-field"><label class="block text-sm" data-ui="form-label" for="open-study-reason">Reason</label><textarea class="border" data-ui="form-input" id="open-study-reason" name="reason" rows="4" minlength="3" required></textarea></div><div data-ui="account-actions"><button class="[background:var(--color-bg-subtle)]" data-ui="secondary-button" type="button" data-dialog-close>Cancel</button><button data-ui="primary-button" type="submit">Open Study Access</button></div></form></div></dialog>
