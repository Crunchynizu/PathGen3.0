{% load static %}
<dialog aria-describedby="unlock-posttest-dialog-description" aria-labelledby="unlock-posttest-dialog-title" id="unlock-posttest-dialog" class="border" data-ui="modal-dialog"><div data-ui="modal-content"><div data-ui="modal-header"><div><p class="text-sm" data-ui="eyebrow"><i data-lucide="circle-check" aria-hidden="true"></i>Post-test Access</p><h2 id="unlock-posttest-dialog-title">Open Post-test Access?</h2></div><button class="text-xl [background:var(--color-bg-subtle)] [color:var(--color-text-secondary)]" data-ui="icon-button" type="button" data-dialog-close aria-label="Close post-test dialog"><i data-lucide="x" aria-hidden="true"></i></button></div><p id="unlock-posttest-dialog-description" class="[color:var(--color-text-secondary)]" data-ui="page-copy">Only students whose path is post-test ready become eligible.</p><p class="border text-sm [background:var(--color-bg-subtle)]">Current Post-test Access: {{ setting.posttest_access_enabled|yesno:"OPEN,CLOSED" }} → Pending: OPEN</p><form data-ui="form-stack" method="post" action="{% url 'portal:override' %}">{% csrf_token %}<input type="hidden" name="expected_revision" value="{{ revision }}"><input type="hidden" name="setting_name" value="posttest_access"><input type="hidden" name="enabled" value="true"><div data-ui="form-field"><label class="block text-sm" data-ui="form-label" for="unlock-posttest-reason">Reason</label><textarea class="border" data-ui="form-input" id="unlock-posttest-reason" name="reason" rows="4" minlength="3" required></textarea></div><div data-ui="account-actions"><button class="[background:var(--color-bg-subtle)]" data-ui="secondary-button" type="button" data-dialog-close>Cancel</button><button data-ui="primary-button" type="submit">Open Post-test Access</button></div></form></div></dialog>
