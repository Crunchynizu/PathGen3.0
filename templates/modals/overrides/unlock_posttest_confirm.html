<dialog aria-label="Unlock Posttest Confirm" id="unlock-posttest-dialog" class="modal-dialog"><div class="modal-content"><div class="modal-header"><div><p class="eyebrow">Post-test Access</p><h2>Open Post-test Access?</h2></div><button class="icon-button" type="button" data-dialog-close aria-label="Close post-test dialog">×</button></div><p class="page-copy">Only students whose path is post-test ready become eligible.</p><form class="form-stack" method="post" action="{% url 'portal:override' %}">{% csrf_token %}<input type="hidden" name="expected_revision" value="{{ revision }}"><input type="hidden" name="setting_name" value="posttest_access"><input type="hidden" name="enabled" value="true"><div class="form-field"><label class="form-label" for="unlock-posttest-reason">Reason</label><textarea class="form-input" id="unlock-posttest-reason" name="reason" rows="4" required></textarea></div><div class="account-actions"><button class="primary-button" type="submit">Open Post-test Access</button><button class="secondary-button" type="button" data-dialog-close>Cancel</button></div></form></div></dialog>
