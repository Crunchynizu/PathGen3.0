<dialog aria-label="Lock Posttest Confirm" id="lock-posttest-dialog" class="modal-dialog"><div class="modal-content"><div class="modal-header"><div><p class="eyebrow">Post-test Access</p><h2>Close Post-test Access?</h2></div><button class="icon-button" type="button" data-dialog-close aria-label="Close post-test dialog">×</button></div><p class="page-copy">Eligible students will see a locked step until access opens again.</p><form class="form-stack" method="post" action="{% url 'portal:override' %}">{% csrf_token %}<input type="hidden" name="expected_revision" value="{{ revision }}"><input type="hidden" name="setting_name" value="posttest_access"><input type="hidden" name="enabled" value="false"><div class="form-field"><label class="form-label" for="lock-posttest-reason">Reason</label><textarea class="form-input" id="lock-posttest-reason" name="reason" rows="4" required></textarea></div><div class="account-actions"><button class="danger-button" type="submit">Close Post-test Access</button><button class="secondary-button" type="button" data-dialog-close>Cancel</button></div></form></div></dialog>
