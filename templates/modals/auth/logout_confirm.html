{% extends "_base.html" %}
{% block title %}Sign out · PathGen{% endblock %}
{% block content %}
<section class="mx-auto mt-10 w-full max-w-[400px] rounded-3xl border p-6 sm:p-8 [background:var(--color-surface)] [border-color:var(--color-border)] [box-shadow:var(--shadow-md)]"><h1>Sign out</h1><p class="mt-2 [color:var(--color-text-secondary)]">Review the confirmation or return to your account.</p><div class="mt-5 flex flex-wrap gap-3"><button class="inline-flex min-h-11 items-center rounded-xl px-5 py-3 font-semibold [background:var(--color-primary)] [color:var(--color-on-primary)]" type="button" data-dialog-open="logout-dialog">Review sign out</button><a class="inline-flex min-h-11 items-center rounded-xl border px-5 py-3 font-semibold [border-color:var(--color-border-strong)] [color:var(--color-text-link)]" href="{% url 'account:my_account' %}">Back to account</a></div></section>
<dialog id="logout-dialog" aria-labelledby="logout-dialog-title" aria-describedby="logout-dialog-description" class="m-auto w-[min(92vw,32rem)] rounded-2xl border p-0 [background:var(--color-surface)] [border-color:var(--color-border)] [color:var(--color-text)] [box-shadow:var(--shadow-md)] [&::backdrop]:[background:var(--color-overlay)] [max-height:calc(100dvh_-_2rem)] [overflow-y:auto]" data-ui="modal-dialog" data-auto-open>
  <div class="p-6 sm:p-8"><div class="flex items-start justify-between gap-4 border-b pb-4 [border-color:var(--color-border)]"><div><p class="mb-2 text-sm font-semibold uppercase tracking-wider [color:var(--color-text-cyan)]"><i data-lucide="log-out" class="mr-2 inline-block h-5 w-5 align-middle [color:var(--color-primary)]" aria-hidden="true"></i>Account</p><h2 id="logout-dialog-title">Sign out?</h2></div><button class="inline-flex min-h-11 min-w-11 items-center justify-center rounded-xl [background:var(--color-bg-subtle)] [color:var(--color-text-secondary)]" type="button" data-dialog-close aria-label="Close sign-out dialog"><i data-lucide="x" class="h-5 w-5" aria-hidden="true"></i></button></div>
    <p id="logout-dialog-description" class="mt-4 leading-7 [color:var(--color-text-secondary)]">You will need to enter your credentials to return.</p>
    <form class="mt-5 flex flex-wrap gap-3" method="post" action="{% url 'account:logout' %}">{% csrf_token %}<button class="inline-flex min-h-11 items-center justify-center rounded-xl border px-5 py-3 font-semibold [background:var(--color-surface)] [border-color:var(--color-border-strong)] [color:var(--color-text)]" type="button" data-dialog-close>Cancel</button><button class="inline-flex min-h-11 items-center justify-center rounded-xl px-5 py-3 font-semibold [background:var(--color-primary)] [color:var(--color-on-primary)]" type="submit">Sign out</button></form>
  </div>
</dialog>
{% endblock %}
