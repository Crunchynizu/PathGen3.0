{% load static %}
<dialog aria-describedby="generic-confirm-description" aria-labelledby="generic-confirm-title" id="{% block dialog_id %}confirm-dialog{% endblock %}" class="m-auto w-[min(92vw,32rem)] rounded-2xl border p-0 [background:var(--color-surface)] [border-color:var(--color-border)] [color:var(--color-text)] [box-shadow:var(--shadow-md)] [&::backdrop]:[background:var(--color-overlay)] [max-height:calc(100dvh_-_2rem)] [overflow-y:auto] [border-radius:var(--radius-lg)]" data-ui="modal-dialog">
  <div class="p-6 sm:p-8 max-sm:[padding:1rem]" data-ui="modal-content">
    <div class="flex items-start justify-between gap-4 [padding-bottom:1rem] [border-bottom:1px_solid_var(--color-border)] [margin-bottom:1.5rem] [&_>_div]:[min-width:0] [&_>_div]:[overflow-wrap:anywhere] [&_[data-ui~=icon-button]]:[flex-shrink:0]" data-ui="modal-header">
      <div><p class="mb-2 text-sm font-semibold uppercase tracking-wider [color:var(--color-text-cyan)]" data-ui="eyebrow"><i data-lucide="circle-check" class="mr-2 inline-block h-5 w-5 align-middle [color:var(--color-primary)]" aria-hidden="true"></i>Confirmation</p><h2 id="generic-confirm-title">{% block dialog_title %}Confirm action{% endblock %}</h2></div>
      <button class="inline-flex min-h-11 min-w-11 items-center justify-center rounded-xl text-xl [background:var(--color-bg-subtle)] [color:var(--color-text-secondary)]" data-ui="icon-button" type="button" data-dialog-close aria-label="Close dialog"><i data-lucide="x" class="w-5 h-5 inline-block shrink-0 align-middle" aria-hidden="true"></i></button>
    </div>
    <p id="generic-confirm-description" class="mt-2 leading-7 [color:var(--color-text-secondary)] [max-width:65ch]" data-ui="page-copy">{% block dialog_message %}Review this action before continuing.{% endblock %}</p>
    {% block dialog_body %}{% endblock %}
    {% block dialog_actions %}<div class="mt-5 flex flex-wrap gap-3"><button class="inline-flex min-h-11 items-center justify-center rounded-xl border px-5 py-3 font-semibold [background:var(--color-surface)] [border-color:var(--color-border-strong)] [color:var(--color-text)]" type="button" data-dialog-close>Cancel</button><button class="inline-flex min-h-11 items-center justify-center rounded-xl px-5 py-3 font-semibold [background:var(--color-primary)] [color:var(--color-on-primary)]" type="button" data-dialog-confirm>Confirm</button></div>{% endblock %}
  </div>
</dialog>
