<dialog aria-label="Archive Class Confirm" id="archive-class-{{ classroom.pk }}" class="modal-dialog"><div class="modal-content"><div class="modal-header"><div><p class="eyebrow">Archive class</p><h2>Archive {{ classroom.code }}?</h2></div><button class="icon-button" type="button" data-dialog-close aria-label="Close archive class dialog">×</button></div><p class="page-copy">Archiving is reversible and preserves membership history.</p><form class="form-stack" method="post" action="{% url 'portal:archive_class' classroom.pk %}">{% csrf_token %}<div class="form-field"><label class="form-label" for="archive-reason-{{ classroom.pk }}">Reason</label><textarea class="form-input" id="archive-reason-{{ classroom.pk }}" name="reason" rows="4" required></textarea></div><div class="account-actions"><button class="danger-button" type="submit">Archive class</button><button class="secondary-button" type="button" data-dialog-close>Cancel</button></div></form></div></dialog>
