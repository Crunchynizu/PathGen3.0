{% load static %}
<dialog aria-labelledby="assign-teacher-{{ classroom.pk }}-title" aria-describedby="assign-teacher-{{ classroom.pk }}-description" id="assign-teacher-{{ classroom.pk }}" class="border" data-ui="modal-dialog"><div data-ui="modal-content"><div data-ui="modal-header"><div><p class="text-sm" data-ui="eyebrow"><i data-lucide="circle-check" aria-hidden="true"></i>Teacher assignment</p><h2 id="assign-teacher-{{ classroom.pk }}-title">{{ classroom.name }}</h2><p id="assign-teacher-{{ classroom.pk }}-description" class="text-sm [color:var(--color-text-secondary)]">One teacher per class.</p></div><button class="text-xl [background:var(--color-bg-subtle)] [color:var(--color-text-secondary)]" data-ui="icon-button" type="button" data-dialog-close aria-label="Close teacher assignment dialog"><i data-lucide="x" aria-hidden="true"></i></button></div><form data-ui="form-stack" method="post" action="{% url 'portal:assign_teacher' classroom.pk %}">{% csrf_token %}<div data-ui="form-field"><label class="block text-sm" data-ui="form-label" for="teacher-{{ classroom.pk }}">Teacher</label><select class="border" data-ui="form-input" id="teacher-{{ classroom.pk }}" name="teacher"><option value="">Unassigned</option>{% for teacher in teachers %}<option value="{{ teacher.pk }}"{% if classroom.teacher_id == teacher.pk %} selected{% endif %}>{{ teacher.get_full_name|default:teacher.username }}</option>{% endfor %}</select></div><div data-ui="account-actions"><button class="[background:var(--color-bg-subtle)]" data-ui="secondary-button" type="button" data-dialog-close>Cancel</button><button data-ui="primary-button" type="submit">Save teacher assignment for {{ classroom.code }}</button></div></form></div></dialog>
