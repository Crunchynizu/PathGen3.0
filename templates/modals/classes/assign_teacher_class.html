<dialog aria-label="Assign Teacher Class" id="assign-teacher-{{ classroom.pk }}" class="modal-dialog"><div class="modal-content"><div class="modal-header"><div><p class="eyebrow">Teacher assignment</p><h2>{{ classroom.name }}</h2></div><button class="icon-button" type="button" data-dialog-close aria-label="Close teacher assignment dialog">×</button></div><form class="form-stack" method="post" action="{% url 'portal:assign_teacher' classroom.pk %}">{% csrf_token %}<div class="form-field"><label class="form-label" for="teacher-{{ classroom.pk }}">Current teacher</label><select class="form-input" id="teacher-{{ classroom.pk }}" name="teacher"><option value="">Unassigned</option>{% for teacher in teachers %}<option value="{{ teacher.pk }}"{% if classroom.teacher_id == teacher.pk %} selected{% endif %}>{{ teacher.get_full_name|default:teacher.username }}</option>{% endfor %}</select></div><div class="account-actions"><button class="primary-button" type="submit">Save assignment</button><button class="secondary-button" type="button" data-dialog-close>Cancel</button></div></form></div></dialog>
