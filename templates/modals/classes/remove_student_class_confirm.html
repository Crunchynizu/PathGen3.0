<dialog aria-label="Remove Student Class Confirm" id="remove-membership-{{ membership.pk }}" class="modal-dialog"><div class="modal-content"><div class="modal-header"><div><p class="eyebrow">Class membership</p><h2>Remove {{ membership.student.get_full_name|default:membership.student.username }}?</h2></div><button class="icon-button" type="button" data-dialog-close aria-label="Close remove student dialog">×</button></div><p class="page-copy">The membership will be closed and retained as history. Learning access is unaffected.</p><form class="account-actions" method="post" action="{% url 'portal:remove_student' membership.pk %}">{% csrf_token %}<button class="danger-button" type="submit">Remove student</button><button class="secondary-button" type="button" data-dialog-close>Cancel</button></form></div></dialog>
