<dialog aria-label="Add Student Class" id="add-student-{{ classroom.pk }}" class="modal-dialog"><div class="modal-content"><div class="modal-header"><div><p class="eyebrow">Class membership</p><h2>Add student to {{ classroom.code }}</h2></div><button class="icon-button" type="button" data-dialog-close aria-label="Close add student dialog">×</button></div><p class="page-copy">Membership supports monitoring only and never grants learning access.</p><form class="form-stack" method="post" action="{% url 'portal:add_student' classroom.pk %}">{% csrf_token %}<div class="form-field"><label class="form-label" for="student-{{ classroom.pk }}">Student</label><select class="form-input" id="student-{{ classroom.pk }}" name="student" required><option value="">Select student</option>{% for student in students %}<option value="{{ student.pk }}">{{ student.get_full_name|default:student.username }}</option>{% endfor %}</select></div><div class="account-actions"><button class="primary-button" type="submit">Add student</button><button class="secondary-button" type="button" data-dialog-close>Cancel</button></div></form></div></dialog>
