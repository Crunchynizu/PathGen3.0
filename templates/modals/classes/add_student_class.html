{% load static %}
<dialog aria-describedby="add-student-{{ classroom.pk }}-description" aria-labelledby="add-student-{{ classroom.pk }}-title" id="add-student-{{ classroom.pk }}" class="border" data-ui="modal-dialog"><div data-ui="modal-content"><div data-ui="modal-header"><div><p class="text-sm" data-ui="eyebrow"><i data-lucide="circle-check" aria-hidden="true"></i>Class membership</p><h2 id="add-student-{{ classroom.pk }}-title">Add student to {{ classroom.code }}</h2></div><button class="text-xl [background:var(--color-bg-subtle)] [color:var(--color-text-secondary)]" data-ui="icon-button" type="button" data-dialog-close aria-label="Close add student dialog"><i data-lucide="x" aria-hidden="true"></i></button></div><p id="add-student-{{ classroom.pk }}-description" class="[color:var(--color-text-secondary)]" data-ui="page-copy">Membership supports monitoring only and never grants learning access.</p><p class="text-sm [color:var(--color-text-secondary)]">Current roster: {{ classroom.active_memberships|length }} students.</p><form data-ui="form-stack" method="post" action="{% url 'portal:add_student' classroom.pk %}">{% csrf_token %}<div data-ui="form-field"><label class="block text-sm" for="student-search-{{ classroom.pk }}">Search students</label><input id="student-search-{{ classroom.pk }}" type="search" data-student-search class="border" autocomplete="off"><label class="block text-sm" data-ui="form-label" for="student-{{ classroom.pk }}">Student</label><select class="border" data-ui="form-input" id="student-{{ classroom.pk }}" name="student" required><option value="">Select student</option>{% for student in students %}<option value="{{ student.pk }}">{{ student.get_full_name|default:student.username }}</option>{% endfor %}</select></div><div data-ui="account-actions"><button class="[background:var(--color-bg-subtle)]" data-ui="secondary-button" type="button" data-dialog-close>Cancel</button><button data-ui="primary-button" type="submit">Add student to {{ classroom.code }}</button></div></form></div></dialog>
