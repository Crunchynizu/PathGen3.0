<dialog aria-label="Delete Class Confirm" id="delete-class-{{ classroom.pk }}" class="modal-dialog"><div class="modal-content"><div class="modal-header"><div><p class="eyebrow">Exceptional deletion</p><h2>Delete {{ classroom.code }}?</h2></div><button class="icon-button" type="button" data-dialog-close aria-label="Close delete class dialog">×</button></div><p class="page-copy">Only an archived, unassigned class without membership history can be deleted.</p><form class="form-stack" method="post" action="{% url 'portal:delete_class' classroom.pk %}">{% csrf_token %}<div class="form-field"><label class="form-label" for="delete-class-reason-{{ classroom.pk }}">Reason</label><textarea class="form-input" id="delete-class-reason-{{ classroom.pk }}" name="reason" rows="4" required></textarea></div><div class="account-actions"><button class="danger-button" type="submit">Delete unused class</button><button class="secondary-button" type="button" data-dialog-close>Cancel</button></div></form></div></dialog>
