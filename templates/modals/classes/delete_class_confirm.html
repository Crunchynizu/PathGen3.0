&:focus]:[border-color:var(--color-primary)] [&:focus]:[box-shadow:0_0_0_3px_var(--color-primary-subtle)] [border-radius:var(--radius-md)] [transition:none] [&:focus-visible]:[outline:2px_solid_var(--color-focus-ring)] [&:focus-visible]:[outline-offset:2px] [&:focus-visible]:[box-shadow:none]" data-ui="form-input" id="delete-class-reason-{{ classroom.pk }}" name="reason" rows="4" required></textarea></div><div class="mt-5 flex flex-wrap gap-3" data-ui="account-actions"><button class="inline-flex min-h-11 items-center justify-center rounded-xl px-5 py-3 font-semibold transition-transform active:scale-[0.98] [background:var(--color-danger)] [color:var(--color-on-primary)] [&:link]:[color:var(--color-on-primary)] [&:visited]:[color:var(--color-on-primary)] [gap:0.5rem] [border-radius:var(--radius-md)] [transition:transform_150ms_ease-out,_opacity_150ms_ease-out]" data-ui="danger-button" type="submit">Delete unused class</button><button class="inline-flex min-h-11 items-center justify-center rounded-xl px-5 py-3 font-semibold transition-transform active:scale-[0.98] [background:var(--color-bg-subtle)] [color:var(--color-text)] [gap:0.5rem] [border-radius:var(--radius-md)] [transition:transform_150ms_ease-out,_opacity_150ms_ease-out] [border:1px_solid_var(--color-border-strong)] [background:transparent]" data-ui="secondary-button" type="button" data-dialog-close>Cancel</button></div></form></div></dialog>
