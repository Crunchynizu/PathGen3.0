<dialog aria-label="Reactivate Class Confirm" id="reactivate-class-{{ classroom.pk }}" class="modal-dialog"><div class="modal-content"><div class="modal-header"><div><p class="eyebrow">Reactivate class</p><h2>Reactivate {{ classroom.code }}?</h2></div><button class="icon-button" type="button" data-dialog-close aria-label="Close reactivate class dialog">×</button></div><p class="page-copy">The class returns to active monitoring. Student learning remains independent of membership.</p><form class="account-actions" method="post" action="{% url 'portal:reactivate_class' classroom.pk %}">{% csrf_token %}<button class="primary-button" type="submit">Reactivate class</button><button class="secondary-button" type="button" data-dialog-close>Cancel</button></form></div></dialog>
