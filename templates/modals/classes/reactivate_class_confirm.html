{% load static %}
<dialog aria-describedby="reactivate-class-{{ classroom.pk }}-description" aria-labelledby="reactivate-class-{{ classroom.pk }}-title" id="reactivate-class-{{ classroom.pk }}" class="border" data-ui="modal-dialog"><div data-ui="modal-content"><div data-ui="modal-header"><div><p class="text-sm" data-ui="eyebrow"><i data-lucide="circle-check" aria-hidden="true"></i>Reactivate class</p><h2 id="reactivate-class-{{ classroom.pk }}-title">Reactivate {{ classroom.code }}?</h2></div><button class="text-xl [background:var(--color-bg-subtle)] [color:var(--color-text-secondary)]" data-ui="icon-button" type="button" data-dialog-close aria-label="Close reactivate class dialog"><i data-lucide="x" aria-hidden="true"></i></button></div><p id="reactivate-class-{{ classroom.pk }}-description" class="[color:var(--color-text-secondary)]" data-ui="page-copy">The class returns to active monitoring. Student learning remains independent of membership.</p><form data-ui="account-actions" method="post" action="{% url 'portal:reactivate_class' classroom.pk %}">{% csrf_token %}<button class="[background:var(--color-bg-subtle)]" data-ui="secondary-button" type="button" data-dialog-close>Cancel</button><button data-ui="primary-button" type="submit">Reactivate {{ classroom.name }}</button></form></div></dialog>
