<dialog aria-label="Update Class" id="update-class-{{ classroom.pk }}" class="modal-dialog"><div class="modal-content"><div class="modal-header"><div><p class="eyebrow">Classes</p><h2>Update {{ classroom.code }}</h2></div><button class="icon-button" type="button" data-dialog-close aria-label="Close update class dialog">×</button></div><form class="form-stack" method="post" action="{% url 'portal:update_class' classroom.pk %}">{% csrf_token %}<div class="form-field"><label class="form-label" for="class-code-{{ classroom.pk }}">Code</label><input class="form-input" id="class-code-{{ classroom.pk }}" name="code" value="{{ classroom.code }}" maxlength="64" required></div><div class="form-field"><label class="form-label" for="class-name-{{ classroom.pk }}">Name</label><input class="form-input" id="class-name-{{ classroom.pk }}" name="name" value="{{ classroom.name }}" maxlength="255" required></div><div class="account-actions"><button class="primary-button" type="submit">Save class</button><button class="secondary-button" type="button" data-dialog-close>Cancel</button></div></form></div></dialog>
