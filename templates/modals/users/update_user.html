<dialog aria-label="Update User" id="update-user-{{ managed_user.pk }}" class="modal-dialog">
  <div class="modal-content"><div class="modal-header"><div><p class="eyebrow">Users</p><h2>Update {{ managed_user.username }}</h2></div><button class="icon-button" type="button" data-dialog-close aria-label="Close update account dialog">×</button></div>
    <form class="form-stack" method="post" action="{% url 'portal:update_user' managed_user.pk %}">{% csrf_token %}<div class="form-field"><label class="form-label" for="first-name-{{ managed_user.pk }}">First name</label><input class="form-input" id="first-name-{{ managed_user.pk }}" name="first_name" value="{{ managed_user.first_name }}" required maxlength="150"></div><div class="form-field"><label class="form-label" for="last-name-{{ managed_user.pk }}">Last name</label><input class="form-input" id="last-name-{{ managed_user.pk }}" name="last_name" value="{{ managed_user.last_name }}" required maxlength="150"></div><div class="form-field"><label class="form-label" for="email-{{ managed_user.pk }}">Email</label><input class="form-input" id="email-{{ managed_user.pk }}" name="email" type="email" value="{{ managed_user.email|default:'' }}"></div><div class="account-actions"><button class="primary-button" type="submit">Save changes</button><button class="secondary-button" type="button" data-dialog-close>Cancel</button></div></form>
  </div>
</dialog>
