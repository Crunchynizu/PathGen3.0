<dialog aria-label="Deactivate User Confirm" id="deactivate-user-{{ managed_user.pk }}" class="modal-dialog"><div class="modal-content"><div class="modal-header"><div><p class="eyebrow">Deactivate account</p><h2>Deactivate {{ managed_user.username }}?</h2></div><button class="icon-button" type="button" data-dialog-close aria-label="Close deactivation dialog">×</button></div><p class="page-copy">All sessions for this account will be invalidated. Learning history is preserved.</p><form class="form-stack" method="post" action="{% url 'portal:deactivate_user' managed_user.pk %}">{% csrf_token %}<div class="form-field"><label class="form-label" for="deactivate-reason-{{ managed_user.pk }}">Reason</label><textarea class="form-input" id="deactivate-reason-{{ managed_user.pk }}" name="reason" rows="4" required></textarea></div><div class="account-actions"><button class="danger-button" type="submit">Deactivate account</button><button class="secondary-button" type="button" data-dialog-close>Cancel</button></div></form></div></dialog>
