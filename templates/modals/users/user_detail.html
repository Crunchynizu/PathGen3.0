{% load static %}
<dialog aria-label="User Detail" id="user-detail-{{ managed_user.pk }}" class="m-auto w-[min(92vw,32rem)] rounded-2xl border p-0 [background:var(--color-surface)] [border-color:var(--color-border)] [color:var(--color-text)] [box-shadow:var(--shadow-md)] [&::backdrop]:[background:var(--color-overlay)] [max-height:calc(100dvh_-_2rem)] [overflow-y:auto] [border-radius:var(--radius-lg)]" data-ui="modal-dialog"><div class="p-6 sm:p-8 max-sm:[padding:1rem]" data-ui="modal-content"><div class="flex items-start justify-between gap-4 [padding-bottom:1rem] [border-bottom:1px_solid_var(--color-border)] [margin-bottom:1.5rem] [&_>_div]:[min-width:0] [&_>_div]:[overflow-wrap:anywhere] [&_[data-ui~=icon-button]]:[flex-shrink:0]" data-ui="modal-header"><div><p class="mb-2 text-sm font-semibold uppercase tracking-wider [color:var(--color-text-cyan)]" data-ui="eyebrow">Account detail</p><h2>{{ managed_user.get_full_name|default:managed_user.username }}</h2></div><button class="inline-flex min-h-11 min-w-11 items-center justify-center rounded-xl text-xl [background:var(--color-bg-subtle)] [color:var(--color-text-secondary)]" data-ui="icon-button" type="button" data-dialog-close aria-label="Close account detail"><i data-lucide="x" class="w-5 h-5 inline-block shrink-0 align-middle" aria-hidden="true"></i></button></div><dl class="mt-5 grid gap-4 sm:grid-cols-2 [&_dt]:text-sm [&_dt]:[color:var(--color-text-muted)] [&_dd]:mt-1 [&_dd]:font-semibold [&_dd]:[color:var(--color-text)]" data-ui="detail-list"><div><dt>Username</dt><dd>{{ managed_user.username }}</dd></div><div><dt>Role</dt><dd>{{ managed_user.get_role_display }}</dd></div><div><dt>Status</dt><dd>{{ managed_user.is_active|yesno:"Active,Inactive" }}</dd></div><div><dt>Email</dt><dd>{{ managed_user.email|default:"Not provided" }}</dd></div></dl></div></dialog>
