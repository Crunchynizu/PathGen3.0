<dialog aria-label="User Detail" id="user-detail-{{ managed_user.pk }}" class="modal-dialog"><div class="modal-content"><div class="modal-header"><div><p class="eyebrow">Account detail</p><h2>{{ managed_user.get_full_name|default:managed_user.username }}</h2></div><button class="icon-button" type="button" data-dialog-close aria-label="Close account detail">×</button></div><dl class="detail-list"><div><dt>Username</dt><dd>{{ managed_user.username }}</dd></div><div><dt>Role</dt><dd>{{ managed_user.get_role_display }}</dd></div><div><dt>Status</dt><dd>{{ managed_user.is_active|yesno:"Active,Inactive" }}</dd></div><div><dt>Email</dt><dd>{{ managed_user.email|default:"Not provided" }}</dd></div></dl></div></dialog>
