{% load static %}
<dialog aria-labelledby="user-detail-{{ managed_user.pk }}-title" id="user-detail-{{ managed_user.pk }}" class="border" data-ui="modal-dialog"><div data-ui="modal-content"><div data-ui="modal-header"><div><p class="text-sm" data-ui="eyebrow"><i data-lucide="info" aria-hidden="true"></i>Account detail</p><h2 id="user-detail-{{ managed_user.pk }}-title">{{ managed_user.get_full_name|default:managed_user.username }}</h2></div><button class="text-xl [background:var(--color-bg-subtle)] [color:var(--color-text-secondary)]" data-ui="icon-button" type="button" data-dialog-close aria-label="Close account detail"><i data-lucide="x" aria-hidden="true"></i></button></div><dl class="grid" data-ui="detail-list"><div><dt>Username</dt><dd>{{ managed_user.username }}</dd></div><div><dt>Role</dt><dd>{{ managed_user.get_role_display }}</dd></div><div><dt>Status</dt><dd>{{ managed_user.is_active|yesno:"Active,Inactive" }}</dd></div><div><dt>Email</dt><dd>{{ managed_user.email|default:"Not provided" }}</dd></div></dl><div><button class="border" type="button" data-dialog-close>Cancel</button></div></div></dialog>
