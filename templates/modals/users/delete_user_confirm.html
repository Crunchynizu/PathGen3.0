{% load static %}
<dialog data-escape-close="false" aria-describedby="delete-user-{{ managed_user.pk }}-description" aria-labelledby="delete-user-{{ managed_user.pk }}-title" id="delete-user-{{ managed_user.pk }}" class="border" data-ui="modal-dialog"><div data-ui="modal-content"><div data-ui="modal-header"><div><p class="text-sm" data-ui="eyebrow"><i data-lucide="alert-triangle" aria-hidden="true"></i>Exceptional deletion</p><h2 id="delete-user-{{ managed_user.pk }}-title">Delete {{ managed_user.username }}?</h2></div><button class="text-xl [background:var(--color-bg-subtle)] [color:var(--color-text-secondary)]" data-ui="icon-button" type="button" data-dialog-close aria-label="Close deletion dialog"><i data-lucide="x" aria-hidden="true"></i></button></div><p id="delete-user-{{ managed_user.pk }}-description" class="[color:var(--color-text-secondary)]" data-ui="page-copy">Only an inactive, unused account without protected history can be deleted.</p><form data-ui="form-stack" method="post" action="{% url 'portal:delete_user' managed_user.pk %}">{% csrf_token %}<div data-ui="form-field"><label class="block text-sm" data-ui="form-label" for="delete-user-reason-{{ managed_user.pk }}">Reason</label><textarea class="border" data-ui="form-input" id="delete-user-reason-{{ managed_user.pk }}" name="reason" rows="4" required></textarea></div><div data-ui="account-actions"><button class="[background:var(--color-bg-subtle)]" data-ui="secondary-button" type="button" data-dialog-close>Cancel</button><button data-ui="danger-button" type="submit">Delete {{ managed_user.username }}</button></div></form></div></dialog>
