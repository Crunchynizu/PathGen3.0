<dialog aria-label="Delete User Confirm" id="delete-user-{{ managed_user.pk }}" class="modal-dialog"><div class="modal-content"><div class="modal-header"><div><p class="eyebrow">Exceptional deletion</p><h2>Delete {{ managed_user.username }}?</h2></div><button class="icon-button" type="button" data-dialog-close aria-label="Close deletion dialog">×</button></div><p class="page-copy">Only an inactive, unused account without protected history can be deleted.</p><form class="form-stack" method="post" action="{% url 'portal:delete_user' managed_user.pk %}">{% csrf_token %}<div class="form-field"><label class="form-label" for="delete-user-reason-{{ managed_user.pk }}">Reason</label><textarea class="form-input" id="delete-user-reason-{{ managed_user.pk }}" name="reason" rows="4" required></textarea></div><div class="account-actions"><button class="danger-button" type="submit">Delete unused account</button><button class="secondary-button" type="button" data-dialog-close>Cancel</button></div></form></div></dialog>
