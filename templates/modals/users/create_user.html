{% load static %}
<dialog aria-label="Create User" id="create-user-dialog" class="m-auto w-[min(92vw,32rem)] rounded-2xl border p-0 [background:var(--color-surface)] [border-color:var(--color-border)] [color:var(--color-text)] [box-shadow:var(--shadow-md)] [&::backdrop]:[background:var(--color-overlay)] [max-height:calc(100dvh_-_2rem)] [overflow-y:auto] [border-radius:var(--radius-lg)]" data-ui="modal-dialog"{% if create_form.errors %} data-auto-open{% endif %}>
  <div class="p-6 sm:p-8 max-sm:[padding:1rem]" data-ui="modal-content"><div class="flex items-start justify-between gap-4 [padding-bottom:1rem] [border-bottom:1px_solid_var(--color-border)] [margin-bottom:1.5rem] [&_>_div]:[min-width:0] [&_>_div]:[overflow-wrap:anywhere] [&_[data-ui~=icon-button]]:[flex-shrink:0]" data-ui="modal-header"><div><p class="mb-2 text-sm font-semibold uppercase tracking-wider [color:var(--color-text-cyan)]" data-ui="eyebrow">Users</p><h2>Create account</h2></div><button class="inline-flex min-h-11 min-w-11 items-center justify-center rounded-xl text-xl [background:var(--color-bg-subtle)] [color:var(--color-text-secondary)]" data-ui="icon-button" type="button" data-dialog-close aria-label="Close create account dialog"><i data-lucide="x" class="w-5 h-5 inline-block shrink-0 align-middle" aria-hidden="true"></i></button></div>
    <form class="mt-7 space-y-5" data-ui="form-stack" method="post" action="{% url 'portal:create_user' %}" novalidate>{% csrf_token %}{% include "partials/form_errors.html" with form=create_form %}{% for field in create_form %}{% include "partials/form_field.html" with field=field %}{% endfor %}<div class="mt-5 flex flex-wrap gap-3" data-ui="account-actions"><button class="inline-flex min-h-11 items-center justify-center rounded-xl px-5 py-3 font-semibold transition-transform active:scale-[0.98] [background:var(--color-primary)] [color:var(--color-on-primary)] [&:hover]:[background:var(--color-primary-hover)] [&:link]:[color:var(--color-on-primary)] [&:visited]:[color:var(--color-on-primary)] [gap:0.5rem] [border-radius:var(--radius-md)] [transition:transform_150ms_ease-out,_opacity_150ms_ease-out]" data-ui="primary-button" type="submit">Create account</button><button class="inline-flex min-h-11 items-center justify-center rounded-xl px-5 py-3 font-semibold transition-transform active:scale-[0.98] [background:var(--color-bg-subtle)] [color:var(--color-text)] [gap:0.5rem] [border-radius:var(--radius-md)] [transition:transform_150ms_ease-out,_opacity_150ms_ease-out] [border:1px_solid_var(--color-border-strong)] [background:transparent]" data-ui="secondary-button" type="button" data-dialog-close>Cancel</button></div></form>
  </div>
</dialog>
