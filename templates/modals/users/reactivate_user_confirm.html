<dialog aria-label="Reactivate User Confirm" id="reactivate-user-{{ managed_user.pk }}" class="modal-dialog"><div class="modal-content"><div class="modal-header"><div><p class="eyebrow">Reactivate account</p><h2>Reactivate {{ managed_user.username }}?</h2></div><button class="icon-button" type="button" data-dialog-close aria-label="Close reactivation dialog">×</button></div><p class="page-copy">This restores account access but does not bypass global Study Access.</p><form class="account-actions" method="post" action="{% url 'portal:reactivate_user' managed_user.pk %}">{% csrf_token %}<button class="primary-button" type="submit">Reactivate account</button><button class="secondary-button" type="button" data-dialog-close>Cancel</button></form></div></dialog>
