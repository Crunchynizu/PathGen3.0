{% load static %}
<dialog aria-describedby="reactivate-user-{{ managed_user.pk }}-description" aria-labelledby="reactivate-user-{{ managed_user.pk }}-title" id="reactivate-user-{{ managed_user.pk }}" class="border" data-ui="modal-dialog"><div data-ui="modal-content"><div data-ui="modal-header"><div><p class="text-sm" data-ui="eyebrow"><i data-lucide="circle-check" aria-hidden="true"></i>Reactivate account</p><h2 id="reactivate-user-{{ managed_user.pk }}-title">Reactivate {{ managed_user.username }}?</h2></div><button class="text-xl [background:var(--color-bg-subtle)] [color:var(--color-text-secondary)]" data-ui="icon-button" type="button" data-dialog-close aria-label="Close reactivation dialog"><i data-lucide="x" aria-hidden="true"></i></button></div><p id="reactivate-user-{{ managed_user.pk }}-description" class="[color:var(--color-text-secondary)]" data-ui="page-copy">This restores account access but does not bypass global Study Access.</p><form data-ui="account-actions" method="post" action="{% url 'portal:reactivate_user' managed_user.pk %}">{% csrf_token %}<button class="[background:var(--color-bg-subtle)]" data-ui="secondary-button" type="button" data-dialog-close>Cancel</button><button data-ui="primary-button" type="submit">Reactivate {{ managed_user.username }}</button></form></div></dialog>
