<dialog aria-label="Update Name" id="update-name-dialog" class="modal-dialog"{% if name_form.errors %} data-auto-open{% endif %}><div class="modal-content"><div class="modal-header"><div><p class="eyebrow">My Account</p><h2>Update name</h2></div><button class="icon-button" type="button" data-dialog-close aria-label="Close update name dialog">×</button></div><form class="form-stack" method="post" action="{% url 'account:update_name' %}" novalidate>{% csrf_token %}{% include "partials/form_errors.html" with form=name_form %}{% for field in name_form %}{% include "partials/form_field.html" with field=field %}{% endfor %}<div class="account-actions"><button class="primary-button" type="submit">Save name</button><button class="secondary-button" type="button" data-dialog-close>Cancel</button></div></form></div></dialog>
