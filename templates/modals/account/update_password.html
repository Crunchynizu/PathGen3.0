<dialog aria-label="Update Password" id="update-password-dialog" class="modal-dialog"{% if password_form.errors %} data-auto-open{% endif %}><div class="modal-content"><div class="modal-header"><div><p class="eyebrow">My Account</p><h2>Change password</h2></div><button class="icon-button" type="button" data-dialog-close aria-label="Close password dialog">×</button></div><p class="page-copy">Changing your password signs out your other sessions.</p><form class="form-stack" method="post" action="{% url 'account:update_password' %}" novalidate>{% csrf_token %}{% include "partials/form_errors.html" with form=password_form %}{% for field in password_form %}{% include "partials/form_field.html" with field=field %}{% endfor %}<div class="account-actions"><button class="primary-button" type="submit">Change password</button><button class="secondary-button" type="button" data-dialog-close>Cancel</button></div></form></div></dialog>
