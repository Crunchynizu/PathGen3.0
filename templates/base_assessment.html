{% extends "base.html" %}
{% load static %}

{% block shell %}
  <header class="flex min-h-16 items-center justify-between border-b px-4 sm:px-6 [background:var(--color-surface)] [border-color:var(--color-border)] [&_[data-ui~=brand]]:text-lg [&_[data-ui~=brand]]:font-bold [&_[data-ui~=brand]]:no-underline [&_[data-ui~=brand]]:[color:var(--color-text)] [gap:1rem] [flex-wrap:wrap] [padding-block:0.5rem]" data-ui="assessment-header">
    <a class="text-xl font-bold tracking-tight [color:var(--color-primary)] [display:inline-flex] [align-items:center] [gap:0.75rem] [&_img]:[flex:0_0_auto] [&_img]:[object-fit:contain]" data-ui="brand" href="/"><img src="{% static 'logo/pathgen.png' %}" width="32" height="32" alt="">PathGen</a>
    {% block assessment_header %}{% endblock %}
  </header>
  <main id="main-content" class="mx-auto w-full max-w-3xl px-4 py-8 sm:px-6" data-ui="assessment-main">
    {% include "partials/messages.html" %}
    {% block assessment_content %}{% endblock %}
  </main>
  <footer class="px-4 py-5 text-center text-sm [color:var(--color-text-muted)]" data-ui="site-footer"><p>{% block focused_footer %}Focused assessment{% endblock %}</p></footer>
{% endblock %}
